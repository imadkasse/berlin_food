        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-mesh {
            background-color: #fcf9f8;
            background-image: 
                radial-gradient(at 0% 0%, rgba(242, 113, 33, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(159, 66, 0, 0.03) 0px, transparent 50%);

<body class="bg-mesh font-body text-on-surface min-h-screen flex flex-col items-center justify-center p-6 selection:bg-primary-container selection:text-on-primary-container">
<!-- Header Branding -->
<header class="fixed top-12 left-0 w-full flex justify-center pointer-events-none">
<div class="flex flex-col items-center gap-1">
<span class="text-2xl font-black italic text-on-surface tracking-tighter">Berlin Food</span>
<div class="flex items-center gap-2">
<div class="h-1 w-8 rounded-full bg-primary"></div>
<div class="h-1 w-8 rounded-full bg-surface-container-highest"></div>
<div class="h-1 w-8 rounded-full bg-surface-container-highest"></div>
</div>
<span class="label-md uppercase tracking-[0.2em] text-on-surface-variant text-[10px] mt-2 font-bold">Step 1 of 3</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-xl">
<div class="bg-surface-container-lowest rounded-lg p-10 md:p-16 shadow-[40px_0_40px_-20px_rgba(28,27,27,0.04)] relative overflow-hidden">
<!-- Visual Accent Decoration -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary-container/5 rounded-full blur-3xl"></div>
<section class="relative z-10">
<div class="mb-12">
<h1 class="text-4xl md:text-5xl font-bold tracking-tight text-on-surface mb-4 leading-tight">
                        The journey to <br/><span class="text-primary italic">exceptional</span> dining.
                    </h1>
<p class="text-on-surface-variant text-lg leading-relaxed max-w-md">
                        Tell us a bit about yourself so we can curate your Berlin culinary experience.
                    </p>
</div>
<form class="space-y-8">
<!-- Name Fields (Asymmetric Grid) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-2">
<label class="label-md font-bold text-xs uppercase tracking-widest text-on-surface-variant ml-1">First Name</label>
<input class="w-full bg-surface-container-low border-none rounded-md px-6 py-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container transition-all" placeholder="Lukas" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="label-md font-bold text-xs uppercase tracking-widest text-on-surface-variant ml-1">Last Name</label>
<input class="w-full bg-surface-container-low border-none rounded-md px-6 py-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container transition-all" placeholder="Schmidt" type="text"/>
</div>
</div>
<!-- Phone Number Field -->
<div class="flex flex-col gap-2">
<label class="label-md font-bold text-xs uppercase tracking-widest text-on-surface-variant ml-1">Phone Number</label>
<div class="relative group">
<div class="absolute left-6 top-1/2 -translate-y-1/2 flex items-center gap-2 pr-4 border-r border-outline-variant/30">
<span class="text-on-surface-variant font-medium">+49</span>
</div>
<input class="w-full bg-surface-container-low border-none rounded-md pl-24 pr-6 py-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container transition-all" placeholder="176 1234 5678" type="tel"/>
</div>
<p class="text-[11px] text-outline mt-1 ml-1 leading-tight">We’ll send a secure verification code to this number.</p>
</div>
<!-- Action Area -->
<div class="pt-6 flex flex-col md:flex-row items-center justify-between gap-6">
<button class="text-on-surface-variant font-medium hover:text-primary transition-colors flex items-center gap-2 group" type="button">
<span class="material-symbols-outlined text-xl group-hover:-translate-x-1 transition-transform">arrow_back</span>
                            Back to Intro
                        </button>
<button class="w-full md:w-auto px-10 py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold rounded-full shadow-lg shadow-primary-container/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3" type="submit">
                            Continue
                            <span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
</div>
</form>
</section>
</div>
<!-- Secondary Decoration - Editorial Image -->
<div class="mt-12 flex items-center justify-center gap-12 opacity-40 grayscale hover:grayscale-0 transition-all duration-700">
<div class="h-px flex-1 bg-gradient-to-r from-transparent via-outline-variant to-transparent"></div>
<div class="flex -space-x-4">
<img class="w-12 h-12 rounded-full border-4 border-background object-cover" data-alt="close-up of artisanal plating with microgreens and vibrant reduction on a matte ceramic plate" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDHACG752m5fwcvgqQFaBwdx6Ca-2XF1dUPJ5Ig4ZpZ5Q3BY4wDvDPTLntjtD3pbfGJ2YLfQLczd0Z8C9vaGL8RxN5q_gmRZznXaK8u9yt7nMSpuoDeLIqmeImfFtLt66S6wUfwLH9c_zrc_Pr1yXsRIhM8EbGblo9N3J3wOgmTYUfOVEJnsE4IMx1m0io5EsDJxu-m5FP3Vh0kAeZPcEiLWjKwPnFvRc4iBZyyNb_dG-Hs8S6xHGBoljEsNaU5P_3v9okYwzYkppp7"/>
<img class="w-12 h-12 rounded-full border-4 border-background object-cover" data-alt="professional chef hands meticulously arranging ingredients with tweezers in a high-end kitchen" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBd2ivg2ijHSj8yBzcKC7TTZbrwy_gEcLP0oHoIidAKCvpOuTORXxz2qb-ih6pCXL6Ilmo-287yN08AIUIFaZsMgKSAMR4pgXHRBtRxe3SE3rfNMldCtNYI_Jxc_bQu8bgM5R4XWjmIqTAkr1Gq3xxgBlRP3LLkjJvSD8GicRBbRKhh0u3QbZkswuR9aELIwjVuv2ag_qqYcR8Yy7j_-aD5TiIlnuYUYEIvU2pqBH41gTI8FSCJKW0uO9FM3dXBFp7egquO3xg8zEOv"/>
<img class="w-12 h-12 rounded-full border-4 border-background object-cover" data-alt="interior of a modern minimalist Berlin restaurant with exposed concrete walls and warm ambient lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCL-6KW9xoL7l1DOe7V8B6qPxln9wHUoRkwOOJOpq8vWgbBkj3SydGEtHKTVHT8uD9tSeZryQ9ETh3hkz2U9MnSeKVzDFHOSYijEQZi4-lMcJxDrOxoodntY7Un7-SqIRXiVDmINS9OQER6puJoJxJl5h599XVEfk73fFkVFVuCaOHvRi65r-nWBfBSqtihUBICKRqGnzZzYa_PtsH8fapdU8-4JNWc4fkVQVP0F-91Uq9a6yXJBQN6mSxroI4aK9-xClEDwWfdBPlM"/>
</div>
<div class="h-px flex-1 bg-gradient-to-r from-transparent via-outline-variant to-transparent"></div>
</div>
</main>
<!-- Footer Security Message -->
<footer class="fixed bottom-8 text-outline text-xs tracking-wide">
        © 2024 Berlin Food · Secure Onboarding · Privacy First
    </footer>
</body></html>
