<h1 class="text-white text-5xl font-extrabold font-headline tracking-tighter leading-tight max-w-md">

<div class="mt-8 flex gap-4">
<div class="h-1 w-12 bg-primary-container rounded-full"></div>

</div>

</div>

<p class="text-secondary mt-2 text-lg">Enter your details to rediscover the city's finest.</p>
</div>
</div>
<!-- Login Form -->
<form class="space-y-6" onsubmit="return false;">
<div class="space-y-2">
<label class="block text-sm font-semibold tracking-wide text-on-surface-variant ml-1">Email Address</label>
<div class="relative">
<input class="w-full h-14 px-5 rounded-lg bg-surface-container-low border-none ring-1 ring-outline-variant/30 focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline/50 outline-none" placeholder="name@example.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="block text-sm font-semibold tracking-wide text-on-surface-variant">Password</label>
<a class="text-sm font-bold text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full h-14 px-5 rounded-lg bg-surface-container-low border-none ring-1 ring-outline-variant/30 focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline/50 outline-none" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<button class="w-full h-14 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold rounded-full text-lg shadow-lg transition-all hover:scale-[1.02] active:scale-[0.98] btn-glow">
                        Login
