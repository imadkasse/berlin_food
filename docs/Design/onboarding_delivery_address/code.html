<body class="bg-background text-on-surface font-body min-h-screen flex items-center justify-center p-6 md:p-12">
<!-- Main Onboarding Container -->
<main class="relative w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
<!-- Left Column: Visual/Content -->
<div class="lg:col-span-5 flex flex-col gap-8 order-2 lg:order-1">
<header class="flex flex-col gap-4">
<span class="label-md tracking-[0.1em] text-primary font-bold uppercase">Step 3 of 3</span>
<h1 class="text-5xl md:text-6xl font-headline font-black italic tracking-tighter leading-tight text-on-surface">
                    Where should we <br/> deliver?
                </h1>
<p class="text-lg text-on-surface-variant leading-relaxed max-w-md">
                    To ensure your culinary selections arrive with chef-level precision, we need your exact location in the city.
                </p>
</header>
<!-- Progress Indicator -->
<div class="flex gap-2 w-full max-w-xs">
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-primary rounded-full shadow-[0_0_12px_rgba(242,113,33,0.4)]"></div>
</div>
<!-- Subtle Decorative Element: Map Pin Concept -->
<div class="hidden lg:flex items-center gap-6 p-8 rounded-lg bg-surface-container-low border border-outline-variant/10">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-3xl" data-icon="location_on">location_on</span>
</div>
<div>
<p class="font-bold text-on-surface">Berlin Delivery Zone</p>
<p class="text-sm text-on-surface-variant">Active coverage within all central districts.</p>
</div>
</div>
</div>
<!-- Right Column: Form -->
<div class="lg:col-span-7 order-1 lg:order-2">
<div class="relative overflow-hidden bg-surface-container-lowest p-8 md:p-12 rounded-lg shadow-[40px_0_80px_-40px_rgba(28,27,27,0.08)]">
<!-- Background Map Texture (Faded) -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" data-location="Berlin" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCcbbCSUVy0EZ2yGgowJO0S12uxAxiy_t8M1jay3GMpVRkzTw-xk2HIM8fLSfgct2vCXFFeRaxD3_VlPNd0QA1XC0ij2dSG4LYhcYDkRVbsvyjTUh4sEBjjgBPPSP1aFM7UPno8JvsBJ3S1u3rnoz_hf4zh0pRLd1XLWhKicOVDk5Fl-855ozwAlIKTYzEva-SI2ivGAZ2p04Dq444EgQFFUDgKDXLE7M7sOPTijSwebfr0GXqlSBKEYbLIzbF6Slue3OCvq771Cf6v'); background-size: cover;">
</div>
<form class="relative z-10 space-y-8">
<!-- Street Address -->
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1">Street and Number</label>
<div class="relative group">
<span class="absolute left-5 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="home">home</span>
<input class="w-full pl-14 pr-6 py-5 bg-surface-container-low border-none rounded-md focus:ring-2 focus:ring-primary-container transition-all text-on-surface placeholder:text-outline/50" placeholder="e.g. Torstraße 120" type="text"/>
</div>
</div>
<!-- City & Zip Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1">Postal Code</label>
<div class="relative group">
<span class="absolute left-5 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="explore">explore</span>
<input class="w-full pl-14 pr-6 py-5 bg-surface-container-low border-none rounded-md focus:ring-2 focus:ring-primary-container transition-all text-on-surface placeholder:text-outline/50" placeholder="10119" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1">City</label>
<div class="relative group">
<span class="absolute left-5 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="apartment">apartment</span>
<input class="w-full pl-14 pr-6 py-5 bg-surface-container-low border-none rounded-md focus:ring-2 focus:ring-primary-container transition-all text-on-surface" type="text" value="Berlin"/>
</div>
</div>
</div>
<!-- Additional Details -->
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1">Delivery Notes (Optional)</label>
<div class="relative group">
<span class="absolute left-5 top-6 material-symbols-outlined text-outline" data-icon="comment">comment</span>
<textarea class="w-full pl-14 pr-6 py-5 bg-surface-container-low border-none rounded-md focus:ring-2 focus:ring-primary-container transition-all text-on-surface placeholder:text-outline/50 resize-none" placeholder="Door code, floor number, or specific instructions..." rows="3"></textarea>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row items-center gap-4 pt-4">
<button class="w-full sm:w-auto px-10 py-5 rounded-full font-bold text-on-surface-variant hover:bg-surface-container-high transition-transform active:scale-95 duration-200" type="button">
                            Back
                        </button>
<button class="w-full flex-1 py-5 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold text-lg shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center gap-2" type="submit">
                            Finish Registration
                            <span class="material-symbols-outlined" data-icon="done_all">done_all</span>
</button>
</div>
</form>
</div>
<!-- Trust Badge -->
<div class="mt-8 flex justify-center lg:justify-end">
<div class="flex items-center gap-3 px-4 py-2 bg-surface-container-high rounded-full">
<span class="material-symbols-outlined text-primary text-sm" data-icon="verified_user">verified_user</span>
<span class="text-xs font-bold text-on-surface-variant tracking-wider uppercase">Secure Data Processing</span>
</div>
</div>
</div>
</main>
<!-- Background Decorative Circle -->
<div class="fixed -bottom-48 -left-48 w-96 h-96 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed -top-48 -right-48 w-96 h-96 bg-tertiary/5 rounded-full blur-3xl pointer-events-none"></div>
</body></html>
